{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Unavailable | RAFAYEL & GRACE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            /* 背景图 */
            background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .error-card {
            background-color: white;
            padding: 70px 40px; /* 稍微增加了上下内边距，让卡片更修长 */
            max-width: 800px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            position: relative;
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2.5rem;
            letter-spacing: 0.2em;
            color: #000;
            margin-bottom: 40px;
            text-transform: uppercase;
            display: block;
            text-decoration: none;
        }

        .message-primary {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.4;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .message-secondary {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 35px; /* 从 40px 减小到 35px，拉近按钮 */
            line-height: 1.8;
            font-weight: 300;
        }

        /* ✨ 新增：专门针对中文的样式优化 */
        .zh-text {
            display: block;
            font-size: 1rem; /* 比英文稍微大一点，视觉上才平衡 */
            margin-top: 12px; /* 中英文之间增加一点呼吸感 */
            color: #444; /* 颜色稍微深一点，增加可读性 */
            letter-spacing: 0.05em; /* 中文稍微加一点点字间距，更优雅 */
        }

        .btn-home {
            display: inline-block;
            background-color: black;
            color: white;
            border: 1px solid black;
            padding: 14px 40px; /* 按钮稍微加大一点，更有份量感 */
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.75rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background-color: white;
            color: black;
        }

        /* 顶部装饰线 */
        .error-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background-color: black;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <a href="/" class="brand-logo">RAFAYEL & GRACE</a>

        <div class="message-primary">
            Page Unavailable
        </div>

        <div class="message-secondary">
            The page you are looking for might have been removed or renamed.<br>
            We invite you to return to the homepage.
            
            <span class="zh-text">請返回主頁重試。</span>
        </div>

        <a href="/" class="btn-home">Return to Homepage</a>
    </div>

</body>
</html>
