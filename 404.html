{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Unavailable | RAFAYEL & GRACE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            /* 背景图：这里用一张建筑或天空的高级图，你可以换成自己的 */
            background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .error-card {
            background-color: white;
            padding: 60px 40px;
            max-width: 800px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            position: relative;
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2.5rem;
            letter-spacing: 0.2em;
            color: #000;
            margin-bottom: 40px;
            text-transform: uppercase;
            display: block;
            text-decoration: none;
        }

        .message-primary {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .message-secondary {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .btn-home {
            background-color: black;
            color: white;
            border: none;
            padding: 12px 30px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.8rem;
            text-decoration: none;
            transition: background 0.3s;
        }

        .btn-home:hover {
            background-color: #333;
            color: white;
        }

        /* 顶部装饰线 */
        .error-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background-color: black;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <a href="/" class="brand-logo">RAFAYEL & GRACE</a>

        <div class="message-primary">
            The page you are looking for is currently unavailable.<br>
            It might have been removed, renamed, or is temporarily inaccessible.
        </div>

        <div class="message-secondary">
            我们恳请您稍后重新连接<br>
            Please try to reconnect later
        </div>

        <a href="/" class="btn-home">Return to Homepage</a>
    </div>

</body>
</html>
