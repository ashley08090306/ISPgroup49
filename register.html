<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | My Shop</title>
    <!-- Use Tailwind CSS for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Background Image Setup */
            background-image: url('https://images.unsplash.com/photo-1531366936337-7c912a4589a7?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-900/30 backdrop-blur-[1px] p-4">

    <div class="w-full max-w-2xl bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl p-8 mx-auto border border-white/40 my-10">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-2 font-serif">Create Account</h2>
            <p class="text-gray-600">Join our community</p>
        </div>

        {% if error %}
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6" role="alert">
            <p>{{ error }}</p>
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-4 border-b border-gray-200 pb-2">Basic Info</div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">Username</label>
                <input type="text" name="username" required
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-1 focus:ring-purple-900 bg-white/50 focus:bg-white outline-none">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">Email</label>
                <input type="email" name="email" required
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-1 focus:ring-purple-900 bg-white/50 focus:bg-white outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">Password</label>
                    <input type="password" name="password" required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-1 focus:ring-purple-900 bg-white/50 focus:bg-white outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">Confirm Password</label>
                    <input type="password" name="confirm_password" required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-1 focus:ring-purple-900 bg-white/50 focus:bg-white outline-none">
                </div>
            </div>

            <div class="mb-6">
                 <label class="block text-gray-700 mb-2 font-medium">I am a:</label>
                 <select name="role" id="roleSelect" onchange="toggleAddress()"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-1 focus:ring-purple-900 bg-white/50 focus:bg-white">
                    <option value="customer">Customer (Buyer)</option>
                    <option value="vendor">Vendor (Seller)</option>
                  </select>
            </div>

            <!-- Address Section -->
            <div id="addressSection">
                <div class="text-gray-500 text-xs font-bold uppercase tracking-widest mt-8 mb-4 border-b border-gray-200 pb-2 flex justify-between">
                    <span>Shipping Address</span>
                    <span class="text-blue-600 text-[10px] bg-blue-100 px-2 rounded-full py-0.5">Required for Customers</span>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div><label class="block text-sm mb-1">Country</label><input type="text" name="country" class="w-full border border-gray-300 rounded px-3 py-2 bg-white/50 focus:bg-white"></div>
                    <div><label class="block text-sm mb-1">City</label><input type="text" name="city" class="w-full border border-gray-300 rounded px-3 py-2 bg-white/50 focus:bg-white"></div>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div><label class="block text-sm mb-1">District</label><input type="text" name="district" class="w-full border border-gray-300 rounded px-3 py-2 bg-white/50 focus:bg-white"></div>
                    <div><label class="block text-sm mb-1">Street</label><input type="text" name="street" class="w-full border border-gray-300 rounded px-3 py-2 bg-white/50 focus:bg-white"></div>
                </div>
                <div class="mb-6">
                    <label class="block text-sm mb-1">Detail Address</label>
                    <input type="text" name="detail_address" class="w-full border border-gray-300 rounded px-3 py-2 bg-white/50 focus:bg-white">
                </div>
            </div>

            <button type="submit"
                class="w-full bg-black hover:bg-purple-900 text-white font-bold py-3 px-4 rounded-lg transition-transform active:scale-95 shadow-lg mt-4">
                Register
            </button>
        </form>

        <p class="text-center mt-6 text-gray-600 text-sm">
            Already have an account? <a href="{% url 'login' %}" class="text-gray-900 font-bold hover:underline hover:text-purple-900">Log in</a>
        </p>
    </div>

    <script>
        function toggleAddress() {
            const role = document.getElementById('roleSelect').value;
            const addressSection = document.getElementById('addressSection');
            const inputs = addressSection.querySelectorAll('input');

            if (role === 'vendor') {
                addressSection.style.display = 'none';
                inputs.forEach(input => input.required = false);
            } else {
                addressSection.style.display = 'block';
                inputs.forEach(input => input.required = true);
            }
        }
        // Run on load
        toggleAddress();
    </script>
</body>
</html>
