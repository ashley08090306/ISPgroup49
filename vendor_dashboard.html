<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .sidebar { background-color: #000; color: #fff; min-height: 100vh; }
        .sidebar a { color: #aaa; text-decoration: none; padding: 15px; display: block; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background-color: #222; }
        .card { border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-0">
                <div class="p-4 text-center border-bottom border-secondary">
                    <h5 class="mb-0 fw-bold">VENDOR PORTAL</h5>
                </div>
                <nav class="mt-3">
                    <a href="{% url 'vendor_dashboard' %}" class="active"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                    <a href="{% url 'vendor_myshop' %}"><i class="bi bi-shop-window me-2"></i> My Shop</a>
                    <a href="{% url 'vendor_products' %}"><i class="bi bi-box-seam me-2"></i> My Products</a>
                    <a href="{% url 'vendor_orders' %}"><i class="bi bi-receipt me-2"></i> Orders</a>
                    <a href="{% url 'home' %}"><i class="bi bi-shop me-2"></i> View Shop</a>
                    <a href="{% url 'logout' %}" class="text-danger mt-5"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                     <h2 class="mb-0">Hello, {{ user.username }}</h2>
                </div>

                <!-- Stats -->
                <div class="row g-4 mb-5">
                    <div class="col-md-4">
                        <div class="card p-4">
                            <h6 class="text-muted small fw-bold">TOTAL SALES</h6>
                            <h3>$0.00</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card p-4">
                            <h6 class="text-muted small fw-bold">PRODUCTS</h6>
                            <h3>0 Active</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card p-4">
                            <h6 class="text-muted small fw-bold">PENDING ORDERS</h6>
                            <h3>0</h3>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="card p-5 text-center">
                    <h5 class="mb-3">Quick Actions</h5>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'vendor_add_product' %}" class="btn btn-dark">
                            <i class="bi bi-plus-lg"></i> Add New Product
                        </a>
                        <a href="{% url 'vendor_orders' %}" class="btn btn-outline-dark">
                            View Orders
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
