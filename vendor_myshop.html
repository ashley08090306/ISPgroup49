<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop - Vendor Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        /* ✨ Sidebar 基础样式 */
        .sidebar {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
        }

        /* 链接样式优化 */
        .sidebar a {
            color: #999;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }
        .sidebar a:hover {
            color: #fff;
            background-color: #1a1a1a;
        }
        .sidebar a.active {
            color: #fff;
            background-color: #111;
            border-left: 4px solid #fff;
        }

        .form-label { font-weight: 500; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; }

        /* ✨✨✨ 底部个人信息区域 (UI升级版) ✨✨✨ */
        .user-profile-section {
            background-color: #1a1a1a;
            margin-top: auto;
            padding: 20px;
            border-top: 1px solid #333;
        }

        /* 渐变色头像 */
        .user-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        /* 文字排版 */
        .user-info-text h6 {
            color: #fff;
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .user-info-text small {
            color: #aaa; /* ✨ 浅灰色 */
            font-size: 0.8rem;
            display: block;
            margin-top: 2px;
        }

        /* Logout 按钮 */
        .btn-logout {
            margin-top: 15px;
            color: #ff6b6b;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.2s;
            padding: 5px 0;
        }
        .btn-logout:hover {
            color: #ff4c4c;
            transform: translateX(3px);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-4 text-center border-bottom border-secondary">
                    <h5 class="mb-0 fw-bold tracking-wider">VENDOR PORTAL</h5>
                </div>

                <nav class="mt-3">
                    <a href="{% url 'vendor_dashboard' %}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                    <a href="{% url 'vendor_myshop' %}" class="active"><i class="bi bi-shop-window me-2"></i> My Shop</a>
                    <a href="{% url 'vendor_products' %}"><i class="bi bi-box-seam me-2"></i> My Products</a>
                    <a href="{% url 'vendor_orders' %}"><i class="bi bi-receipt me-2"></i> Orders</a>
                    <a href="{% url 'home' %}" target="_blank">
                        <i class="bi bi-shop me-2"></i> View Shop
                        <i class="bi bi-box-arrow-up-right ms-auto" style="font-size: 0.7em;"></i>
                    </a>
                </nav>

                <div class="user-profile-section">
                    <div class="d-flex align-items-center">
                        <div class="user-avatar me-3">
                            {{ request.user.username|slice:":1"|upper }}
                        </div>
                        <div class="user-info-text" style="overflow: hidden;">
                            <h6 class="text-truncate" title="{{ request.user.username }}">{{ request.user.username }}</h6>
                            <small class="text-truncate" title="{{ request.user.email }}">{{ request.user.email }}</small>
                        </div>
                    </div>

                    <a href="{% url 'logout' %}" class="btn-logout">
                        <i class="bi bi-box-arrow-right me-2"></i> Log out
                    </a>
                </div>
            </div>

            <div class="col-md-10 p-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                     <h2>My Shop Profile (Global)</h2>
                     <button type="submit" form="shopForm" class="btn btn-dark px-4">Save Changes</button>
                </div>

                <form id="shopForm" method="POST" action="{% url 'vendor_myshop' %}">
                    {% csrf_token %}
                    <div class="row g-5">
                        <div class="col-md-6">
                            <div class="card p-4 border-0 shadow-sm h-100">
                                <h5 class="mb-4 border-bottom pb-2">Basic Information</h5>

                                <div class="mb-3">
                                    <label class="form-label">Shop Name</label>
                                    <input type="text" name="shop_name" class="form-control form-control-lg" value="{{ shop.shop_name }}" required>
                                    <div class="form-text">This name is shared across all vendors.</div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Contact Email</label>
                                    <input type="email" name="email" class="form-control" value="{{ shop.email }}" required>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="card p-4 border-0 shadow-sm h-100">
                                <h5 class="mb-4 border-bottom pb-2">Business Address</h5>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Country</label>
                                        <input type="text" name="country" class="form-control" value="{{ shop.country|default:'' }}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">City</label>
                                        <input type="text" name="city" class="form-control" value="{{ shop.city|default:'' }}">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">District / State</label>
                                    <input type="text" name="district" class="form-control" value="{{ shop.district|default:'' }}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Street Address</label>
                                    <input type="text" name="street" class="form-control" value="{{ shop.street|default:'' }}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Detail / Apt / Suite</label>
                                    <input type="text" name="detail_address" class="form-control" value="{{ shop.detail_address|default:'' }}">
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
