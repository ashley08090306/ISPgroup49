<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop - Vendor Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .sidebar { background-color: #000; color: #fff; min-height: 100vh; }
        .sidebar a { color: #aaa; text-decoration: none; padding: 15px; display: block; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background-color: #222; }
        .form-label { font-weight: 500; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-0">
                <div class="p-4 text-center border-bottom border-secondary">
                    <h5 class="mb-0 fw-bold">VENDOR PORTAL</h5>
                </div>
                <nav class="mt-3">
                    <a href="{% url 'vendor_dashboard' %}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                    <a href="{% url 'vendor_myshop' %}" class="active"><i class="bi bi-shop-window me-2"></i> My Shop</a>
                    <a href="{% url 'vendor_products' %}"><i class="bi bi-box-seam me-2"></i> My Products</a>
                    <a href="{% url 'vendor_orders' %}"><i class="bi bi-receipt me-2"></i> Orders</a>
                    <a href="{% url 'home' %}"><i class="bi bi-shop me-2"></i> View Shop</a>
                    <a href="{% url 'logout' %}" class="text-danger mt-5"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                     <h2>My Shop Profile</h2>
                     <button type="submit" form="shopForm" class="btn btn-dark px-4">Save Changes</button>
                </div>

                <form id="shopForm" method="POST" action="{% url 'vendor_myshop' %}">
                    {% csrf_token %}
                    <div class="row g-5">
                        <!-- Left Column: Basic Info -->
                        <div class="col-md-6">
                            <div class="card p-4 border-0 shadow-sm h-100">
                                <h5 class="mb-4 border-bottom pb-2">Basic Information</h5>

                                <div class="mb-3">
                                    <label class="form-label">Shop Name (Username)</label>
                                    <input type="text" name="shop_name" class="form-control form-control-lg" value="{{ user.username }}" required>
                                    <div class="form-text">This will be displayed to customers.</div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Contact Email</label>
                                    <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column: Location/Address -->
                        <div class="col-md-6">
                            <div class="card p-4 border-0 shadow-sm h-100">
                                <h5 class="mb-4 border-bottom pb-2">Business Address</h5>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Country</label>
                                        <input type="text" name="country" class="form-control" value="{{ address.country|default:'' }}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">City</label>
                                        <input type="text" name="city" class="form-control" value="{{ address.city|default:'' }}">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">District / State</label>
                                    <input type="text" name="district" class="form-control" value="{{ address.district|default:'' }}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Street Address</label>
                                    <input type="text" name="street" class="form-control" value="{{ address.street|default:'' }}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Detail / Apt / Suite</label>
                                    <input type="text" name="detail_address" class="form-control" value="{{ address.detail_address|default:'' }}">
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
